<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Contact Us</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
  :root{
    --bg: #DCEEE1;
    --card-bg: #FFFFFF;
    --text-dark: #29343B;
    --text-body: #384750;
    --text-placeholder: #8B98A0;
    --border: #CBD5D7;
    --border-hover: #9FB2B0;
    --teal: #157A5B;
    --teal-dark: #0E5A42;
    --teal-darker: #0B4A37;
    --teal-tint: #EAF6EF;
    --error: #C0392B;
    --error-border: #D9827A;
    --toast-bg: #1D2E30;
    --shadow: 0 1px 2px rgba(0,0,0,0.05), 0 8px 24px rgba(20,40,35,0.06);
    --radius-card: 16px;
    --radius-field: 8px;
  }

  *, *::before, *::after{ box-sizing: border-box; }

  body{
    margin:0;
    font-family:'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', system-ui, sans-serif;
    background:var(--bg);
    color:var(--text-body);
    -webkit-font-smoothing:antialiased;
  }

  .page{
    min-height:100vh;
    display:flex;
    flex-direction:column;
    align-items:center;
    justify-content:center;
    padding:48px 20px;
  }

  .sr-only{
    position:absolute;
    width:1px;height:1px;
    padding:0;margin:-1px;
    overflow:hidden;
    clip:rect(0,0,0,0);
    white-space:nowrap;
    border:0;
  }

  /* Toast */
  .toast{
    display:flex;
    gap:14px;
    align-items:flex-start;
    background:var(--toast-bg);
    color:#fff;
    border-radius:16px;
    padding:20px 24px;
    max-width:656px;
    width:100%;
    margin-bottom:16px;
    box-shadow:var(--shadow);
    opacity:0;
    transform:translateY(8px);
    transition:opacity .25s ease, transform .25s ease;
  }
  .toast.show{ opacity:1; transform:translateY(0); }
  .toast[hidden]{ display:none !important; }
  .toast-icon{
    flex-shrink:0;
    width:22px; height:22px;
    margin-top:2px;
  }
  .toast-title{
    margin:0 0 2px;
    font-weight:700;
    font-size:16px;
  }
  .toast-desc{
    margin:0;
    font-size:14px;
    color:#D7E4E0;
  }

  /* Card */
  .card{
    background:var(--card-bg);
    border-radius:var(--radius-card);
    padding:40px;
    max-width:656px;
    width:100%;
    box-shadow:var(--shadow);
  }

  h1{
    font-size:28px;
    font-weight:700;
    color:var(--text-dark);
    margin:0 0 28px;
  }

  form{ display:flex; flex-direction:column; }

  .row{ display:flex; gap:24px; }
  .row .field{ flex:1; min-width:0; }

  .field{ margin-bottom:24px; display:flex; flex-direction:column; }

  fieldset.field{ border:none; padding:0; margin:0 0 24px; }

  label, legend{
    font-size:14px;
    font-weight:500;
    color:var(--text-dark);
    margin-bottom:8px;
    display:block;
    padding:0;
  }

  .req{ color:var(--teal); margin-left:3px; }

  input[type="text"],
  input[type="email"],
  textarea{
    font-family:inherit;
    font-size:15px;
    color:var(--text-dark);
    background:#fff;
    border:1px solid var(--border);
    border-radius:var(--radius-field);
    padding:12px 14px;
    width:100%;
    transition:border-color .15s ease, box-shadow .15s ease;
  }

  input[type="text"]::placeholder,
  input[type="email"]::placeholder,
  textarea::placeholder{ color:var(--text-placeholder); }

  input[type="text"]:hover,
  input[type="email"]:hover,
  textarea:hover{ border-color:var(--border-hover); }

  input[type="text"]:focus,
  input[type="email"]:focus,
  textarea:focus{
    outline:none;
    border-color:var(--teal);
    box-shadow:0 0 0 3px rgba(21,122,91,0.15);
  }

  input[aria-invalid="true"],
  textarea[aria-invalid="true"]{
    border-color:var(--error-border);
  }
  input[aria-invalid="true"]:focus,
  textarea[aria-invalid="true"]:focus{
    box-shadow:0 0 0 3px rgba(192,57,43,0.15);
  }

  textarea{ min-height:120px; resize:vertical; }

  .error-msg{
    color:var(--error);
    font-size:13px;
    margin:6px 0 0;
  }
  .error-msg[hidden]{ display:none; }

  /* Radio options */
  .options{ display:flex; gap:16px; }

  .option{
    position:relative;
    flex:1;
    display:flex;
    align-items:center;
    gap:10px;
    border:1px solid var(--border);
    border-radius:var(--radius-field);
    padding:12px 14px;
    cursor:pointer;
    font-size:15px;
    font-weight:400;
    color:var(--text-body);
    margin:0;
    transition:border-color .15s ease, background-color .15s ease;
  }
  .option:hover{ border-color:var(--border-hover); }
  .option.selected{
    border-color:var(--teal);
    background:var(--teal-tint);
  }

  .option input[type="radio"]{
    position:absolute;
    inset:0;
    opacity:0;
    margin:0;
    cursor:pointer;
    width:100%;
    height:100%;
  }

  .radio-visual{
    width:18px; height:18px;
    border-radius:50%;
    border:2px solid #B7C4C4;
    flex-shrink:0;
    position:relative;
    transition:border-color .15s ease;
  }
  .radio-visual::after{
    content:"";
    position:absolute; inset:3px;
    border-radius:50%;
    background:var(--teal);
    transform:scale(0);
    transition:transform .12s ease;
  }
  .option input:checked ~ .radio-visual{ border-color:var(--teal); }
  .option input:checked ~ .radio-visual::after{ transform:scale(1); }
  .option input:focus-visible ~ .radio-visual{
    box-shadow:0 0 0 3px rgba(21,122,91,0.25);
  }

  /* Checkbox */
  .checkbox-field{ margin-bottom:28px; }
  .checkbox-label{
    position:relative;
    display:flex;
    align-items:flex-start;
    gap:10px;
    font-size:14px;
    font-weight:400;
    color:var(--text-body);
    cursor:pointer;
  }
  .checkbox-label input[type="checkbox"]{
    position:absolute;
    inset:0;
    width:20px; height:20px;
    opacity:0;
    margin:0;
    cursor:pointer;
  }
  .checkbox-visual{
    width:18px; height:18px;
    margin-top:1px;
    border:1.5px solid #B7C4C4;
    border-radius:4px;
    flex-shrink:0;
    position:relative;
    transition:background-color .15s ease, border-color .15s ease;
  }
  .checkbox-visual::after{
    content:"";
    position:absolute;
    left:5px; top:1px;
    width:5px; height:9px;
    border:solid #fff;
    border-width:0 2px 2px 0;
    transform:rotate(45deg) scale(0);
    transition:transform .1s ease;
  }
  .checkbox-label input:checked ~ .checkbox-visual{
    background:var(--teal);
    border-color:var(--teal);
  }
  .checkbox-label input:checked ~ .checkbox-visual::after{
    transform:rotate(45deg) scale(1);
  }
  .checkbox-label input:focus-visible ~ .checkbox-visual{
    box-shadow:0 0 0 3px rgba(21,122,91,0.25);
  }

  /* Submit */
  .submit-btn{
    width:100%;
    background:var(--teal);
    color:#fff;
    border:none;
    border-radius:var(--radius-field);
    padding:14px;
    font-family:inherit;
    font-size:16px;
    font-weight:600;
    cursor:pointer;
    transition:background-color .15s ease;
  }
  .submit-btn:hover{ background:var(--teal-dark); }
  .submit-btn:active{ background:var(--teal-darker); }
  .submit-btn:focus-visible{
    outline:none;
    box-shadow:0 0 0 3px rgba(21,122,91,0.35);
  }

  @media (max-width: 600px){
    .page{ padding:16px; align-items:flex-start; }
    .card{ padding:24px; border-radius:12px; }
    h1{ font-size:22px; margin-bottom:22px; }
    .row{ flex-direction:column; gap:0; }
    .options{ flex-direction:column; gap:12px; }
    .toast{ padding:16px 18px; border-radius:12px; }
  }

  @media (prefers-reduced-motion: reduce){
    *{ transition:none !important; }
  }
</style>
</head>
<body>
<div class="page">

  <div id="toast" class="toast" role="status" aria-live="polite" hidden>
    <svg class="toast-icon" viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg" aria-hidden="true">
      <circle cx="12" cy="12" r="10" stroke="#ffffff" stroke-width="1.6"/>
      <path d="M8 12.5l2.5 2.5L16 9.5" stroke="#ffffff" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"/>
    </svg>
    <div>
      <p class="toast-title">Message Sent!</p>
      <p class="toast-desc">Thanks for completing the form. We&rsquo;ll be in touch soon!</p>
    </div>
  </div>

  <main class="card">
    <h1>Contact Us</h1>

    <form id="contactForm" novalidate>

      <div class="row">
        <div class="field">
          <label for="firstName">First Name<span class="req" aria-hidden="true">*</span><span class="sr-only"> (required)</span></label>
          <input type="text" id="firstName" name="firstName" autocomplete="given-name" aria-describedby="firstName-error">
          <p class="error-msg" id="firstName-error" role="alert" hidden>This field is required</p>
        </div>
        <div class="field">
          <label for="lastName">Last Name<span class="req" aria-hidden="true">*</span><span class="sr-only"> (required)</span></label>
          <input type="text" id="lastName" name="lastName" autocomplete="family-name" aria-describedby="lastName-error">
          <p class="error-msg" id="lastName-error" role="alert" hidden>This field is required</p>
        </div>
      </div>

      <div class="field">
        <label for="email">Email Address<span class="req" aria-hidden="true">*</span><span class="sr-only"> (required)</span></label>
        <input type="email" id="email" name="email" autocomplete="email" placeholder="email@example.com" aria-describedby="email-error">
        <p class="error-msg" id="email-error" role="alert" hidden>Please enter a valid email address</p>
      </div>

      <fieldset class="field" id="queryFieldset" aria-describedby="queryType-error">
        <legend>Query Type<span class="req" aria-hidden="true">*</span><span class="sr-only"> (required)</span></legend>
        <div class="options">
          <label class="option" for="queryGeneral">
            <input type="radio" id="queryGeneral" name="queryType" value="general">
            <span class="radio-visual" aria-hidden="true"></span>
            General Enquiry
          </label>
          <label class="option" for="querySupport">
            <input type="radio" id="querySupport" name="queryType" value="support">
            <span class="radio-visual" aria-hidden="true"></span>
            Support Request
          </label>
        </div>
        <p class="error-msg" id="queryType-error" role="alert" hidden>Please select a query type</p>
      </fieldset>

      <div class="field">
        <label for="message">Message<span class="req" aria-hidden="true">*</span><span class="sr-only"> (required)</span></label>
        <textarea id="message" name="message" rows="5" aria-describedby="message-error"></textarea>
        <p class="error-msg" id="message-error" role="alert" hidden>This field is required</p>
      </div>

      <div class="field checkbox-field">
        <label class="checkbox-label" for="consent">
          <input type="checkbox" id="consent" name="consent" aria-describedby="consent-error">
          <span class="checkbox-visual" aria-hidden="true"></span>
          <span>I consent to being contacted by the team<span class="req" aria-hidden="true">*</span><span class="sr-only"> (required)</span></span>
        </label>
        <p class="error-msg" id="consent-error" role="alert" hidden>To submit this form, please consent to being contacted</p>
      </div>

      <p class="error-msg" id="submit-error" role="alert" hidden></p>

      <button type="submit" class="submit-btn">Submit</button>
    </form>
  </main>
</div>

<script>
(function(){
  var form = document.getElementById('contactForm');
  var toast = document.getElementById('toast');
  var toastTimer = null;

  var firstName = document.getElementById('firstName');
  var lastName  = document.getElementById('lastName');
  var email     = document.getElementById('email');
  var message   = document.getElementById('message');
  var consent   = document.getElementById('consent');
  var radios    = form.querySelectorAll('input[name="queryType"]');

  var emailPattern = /^[^\s@]+@[^\s@]+\.[^\s@]+$/;

  function setInvalid(input, errorEl){
    input.setAttribute('aria-invalid', 'true');
    errorEl.hidden = false;
  }
  function setValid(input, errorEl){
    input.removeAttribute('aria-invalid');
    errorEl.hidden = true;
  }

  function validateRequiredText(input, errorEl){
    if (input.value.trim() === ''){
      setInvalid(input, errorEl);
      return false;
    }
    setValid(input, errorEl);
    return true;
  }

  function validateEmail(){
    var errorEl = document.getElementById('email-error');
    var val = email.value.trim();
    if (val === '' || !emailPattern.test(val)){
      setInvalid(email, errorEl);
      return false;
    }
    setValid(email, errorEl);
    return true;
  }

  function validateQueryType(){
    var errorEl = document.getElementById('queryType-error');
    var checked = form.querySelector('input[name="queryType"]:checked');
    var fieldset = document.getElementById('queryFieldset');
    if (!checked){
      fieldset.setAttribute('aria-invalid', 'true');
      errorEl.hidden = false;
      return false;
    }
    fieldset.removeAttribute('aria-invalid');
    errorEl.hidden = true;
    return true;
  }

  function validateConsent(){
    var errorEl = document.getElementById('consent-error');
    if (!consent.checked){
      errorEl.hidden = false;
      return false;
    }
    errorEl.hidden = true;
    return true;
  }

  // Live-update the selected visual state on radio options
  radios.forEach(function(radio){
    radio.addEventListener('change', function(){
      radios.forEach(function(r){
        r.closest('.option').classList.toggle('selected', r.checked);
      });
      validateQueryType();
    });
  });

  // Clear individual field errors as the user fixes them
  firstName.addEventListener('input', function(){ validateRequiredText(firstName, document.getElementById('firstName-error')); });
  lastName.addEventListener('input', function(){ validateRequiredText(lastName, document.getElementById('lastName-error')); });
  message.addEventListener('input', function(){ validateRequiredText(message, document.getElementById('message-error')); });
  email.addEventListener('input', function(){
    if (email.getAttribute('aria-invalid') === 'true') validateEmail();
  });
  consent.addEventListener('change', validateConsent);

  function showToast(){
    if (toastTimer) clearTimeout(toastTimer);
    toast.hidden = false;
    // allow the browser to register the element before transitioning in
    requestAnimationFrame(function(){ toast.classList.add('show'); });
    toastTimer = setTimeout(function(){
      toast.classList.remove('show');
      setTimeout(function(){ toast.hidden = true; }, 250);
    }, 6000);
  }

  var submitBtn = form.querySelector('.submit-btn');
  var submitError = document.getElementById('submit-error');

  function showSubmitError(msg){
    submitError.textContent = msg;
    submitError.hidden = false;
  }
  function clearSubmitError(){
    submitError.hidden = true;
    submitError.textContent = '';
  }

  form.addEventListener('submit', async function(e){
    e.preventDefault();
    clearSubmitError();

    var validFirst   = validateRequiredText(firstName, document.getElementById('firstName-error'));
    var validLast    = validateRequiredText(lastName, document.getElementById('lastName-error'));
    var validEmail   = validateEmail();
    var validQuery   = validateQueryType();
    var validMessage = validateRequiredText(message, document.getElementById('message-error'));
    var validConsent = validateConsent();

    var allValid = validFirst && validLast && validEmail && validQuery && validMessage && validConsent;

    if (!allValid){
      var firstInvalid = form.querySelector('[aria-invalid="true"]');
      if (!firstInvalid && !validQuery){
        firstInvalid = document.getElementById('queryGeneral');
      }
      if (!firstInvalid && !validConsent){
        firstInvalid = consent;
      }
      if (firstInvalid) firstInvalid.focus();
      return;
    }

    var payload = {
      firstName: firstName.value.trim(),
      lastName: lastName.value.trim(),
      email: email.value.trim(),
      queryType: (form.querySelector('input[name="queryType"]:checked') || {}).value,
      message: message.value.trim(),
      consent: consent.checked
    };

    submitBtn.disabled = true;
    submitBtn.textContent = 'Sending...';

    try {
      var response = await fetch('/api/contact', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify(payload)
      });

      if (response.ok){
        showToast();
        form.reset();
        radios.forEach(function(r){ r.closest('.option').classList.remove('selected'); });
        [firstName, lastName, email, message].forEach(function(input){
          input.removeAttribute('aria-invalid');
        });
        document.getElementById('queryFieldset').removeAttribute('aria-invalid');
        firstName.focus();
      } else {
        var data = await response.json().catch(function(){ return {}; });
        showSubmitError(data.error || 'Something went wrong. Please try again.');
      }
    } catch (err) {
      showSubmitError('Network error. Please check your connection and try again.');
    } finally {
      submitBtn.disabled = false;
      submitBtn.textContent = 'Submit';
    }
  });
})();
</script>
</body>
</html>
